# Keep every public page on one canonical host and one clean URL.
[[redirects]]
from = "https://www.foodsafeiq.com/*"
to = "https://foodsafeiq.com/:splat"
status = 301
force = true

# NOTE: Do not add "/page/" -> "/page" rules. Netlify strips trailing slashes
# before matching, so such a rule also matches "/page" and redirects it to
# itself forever (this caused the Oct 2026 outage). "/page/" is already served
# as "/page" by Netlify's normalization; canonical tags handle SEO.

[[redirects]]
from = "/index.html"
to = "/"
status = 301
force = true

